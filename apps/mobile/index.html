<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7faf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="HealthThread 手机端：记录身体感受、准备就诊、核对健康资料。" />
  <title>HealthThread · 手机 App</title>
  <link rel="icon" type="image/svg+xml" href="./assets/mark.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"><div class="launch-help">正在打开 HealthThread…</div></div>
  <div id="overlays"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/runtime-config.js"></script>
  <script type="module">
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = '<div class="launch-help"><h1>启动手机端预览</h1><p>在仓库根目录运行 npm start，再打开本地预览。</p><a href="http://127.0.0.1:4173/mobile/index.html">打开手机端</a></div>';
    } else {
      import('./app.js').catch(error => {
        console.error(error);
        document.getElementById('app').innerHTML = '<div class="launch-help"><h1>页面未能加载</h1><p>请刷新，或确认代码文件完整。</p><a href="./index.html">重新打开</a></div>';
      });
    }
  </script>
</body>
</html>
