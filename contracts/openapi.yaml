                }
              }
            }
          }
        },
        "security": [],
        "description": "Liveness stays available during recoverable dispatch storage contention; dispatch reports ready/backoff/suspended, finite failure count, next attempt timestamp and sanitized last_error. Queued sources remain persisted."
      }
    },
    "/api/entries": {
      "post": {
        "summary": "Persist source, entry, pending episode, run and outbox atomically",
        "operationId": "post_entries",
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Domain error; no sensitive internals",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "Missing or invalid epoch header; no mutation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Stale scope epoch or other optimistic concurrency/idempotency conflict; no new effect",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          },
          {
            "$ref": "#/components/parameters/HealthThreadEpoch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true,
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "input_kind": {
                    "const": "self_report"
                  },
                  "episode_id": {
                    "type": [
                      "string",
                      "null"
                    ]
                  }
                },
                "required": [
                  "text"
                ]
              }
            }
          }
        }
      }
    },
