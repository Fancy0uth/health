                  "expected_profile_revision"
                ],
                "properties": {
                  "expected_profile_revision": {
                    "type": "integer",
                    "minimum": 1
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "New run and outbox persisted; old candidate expired and old scope revoked; original source unchanged",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReanalysisReceipt"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Same-origin/CSRF/owner/consent and current-revision checks; stale version or non-review run returns409",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "Missing or invalid epoch header; no mutation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
