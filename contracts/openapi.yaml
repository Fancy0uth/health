                    "type": "string",
                    "format": "binary"
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        }
      },
      "get": {
        "operationId": "get_documents",
        "summary": "Bounded owner-only documents discovery across sessions; excludes deleted records and private authority",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "before",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Opaque next_cursor from the previous page; newest first."
          }
        ],
        "responses": {
          "200": {
            "description": "Newest-first page; no owner/private runtime binding fields",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DocumentSummaryPage"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Authenticated domain error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
