              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          },
          {
            "$ref": "#/components/parameters/HealthThreadEpoch"
          }
        ]
      }
    },
    "/api/health-assistant": {
      "post": {
        "summary": "Legacy migration adapter into visit-preparations",
        "operationId": "post_health_assistant",
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Domain error; no sensitive internals",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "Missing or invalid epoch header; no mutation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Stale scope epoch or other optimistic concurrency/idempotency conflict; no new effect",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          },
          {
            "$ref": "#/components/parameters/HealthThreadEpoch"
          }
        ]
      }
    },
    "/api/runs/{id}/reanalyse": {
      "post": {
        "summary": "Expire a needs_review proposal and atomically create a new run from saved sources using the current profile revision; never confirm stale facts",
        "operationId": "post_runs_id_reanalyse",
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          },
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/HealthThreadEpoch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true,
                "required": [
                  "expected_profile_revision"
                ],
                "properties": {
                  "expected_profile_revision": {
                    "type": "integer",
                    "minimum": 1
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "New run and outbox persisted; old candidate expired and old scope revoked; original source unchanged",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReanalysisReceipt"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Same-origin/CSRF/owner/consent and current-revision checks; stale version or non-review run returns409",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "Missing or invalid epoch header; no mutation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Stale scope epoch or other optimistic concurrency/idempotency conflict; no new effect",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/runs": {
      "get": {
        "operationId": "get_runs",
        "summary": "Bounded owner-only runs discovery across sessions; excludes deleted records and private authority",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "before",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Opaque next_cursor from the previous page; newest first."
          },
          {
            "name": "source_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "enum": [
                "queued",
                "running",
                "needs_review",
                "completed",
                "failed",
                "blocked",
                "interrupted",
                "cancelled"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Newest-first page; no owner/private runtime binding fields",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunSummaryPage"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Authenticated domain error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "ht_session"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "phase": {
                "type": "string"
              },
              "retryable": {
                "type": "boolean"
              },
              "details": {}
            },
            "required": [
              "code",
              "message",
              "request_id",
              "phase",
              "retryable"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "ReanalysisReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "run_id",
          "source_id",
          "operation_id",
          "expired_fact_change_id",
          "saved"
        ],
        "properties": {
          "run_id": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "operation_id": {
            "type": "string"
          },
          "expired_fact_change_id": {
            "type": "string"
          },
          "saved": {
            "const": true
          }
        }
      },
      "RunSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "workflow",
          "status",
          "phase",
          "source_ids",
          "base_profile_revision",
          "created_at",
          "operation_id",
          "saved_receipt",
          "tool_receipts"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "workflow": {
            "enum": [
              "entry",
              "document",
              "visit",
              "care_plan"
            ]
          },
          "status": {
            "enum": [
              "queued",
              "running",
              "needs_review",
              "completed",
              "failed",
              "blocked",
              "interrupted",
              "cancelled"
            ]
          },
          "phase": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "operation_id": {
            "type": "string"
          },
          "fact_change_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "result_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "result_ref": {
            "type": [
              "string",
              "null"
            ]
          },
          "document_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "parent_run_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "source_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "tool_receipts": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "base_profile_revision": {
            "type": "integer",
            "minimum": 1
          },
          "repair_attempts": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2
          },
          "error": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Error/properties/error"
              },
              {
                "type": "null"
              }
            ]
          },
          "execution_error": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Error/properties/error"
              },
              {
                "type": "null"
              }
            ]
          },
          "deleted": {
            "type": "boolean"
          },
          "saved_receipt": {
            "type": "object",
            "required": [
              "id"
            ],
            "properties": {
              "id": {
                "type": "string"
              },
              "saved": {
                "type": "boolean"
              }
            }
          },
          "runtime": {
            "type": "object",
            "properties": {
              "mode": {
                "enum": [
                  "fixture",
                  "real"
                ]
              },
              "agh": {
                "type": "object",
                "required": [
                  "provider",
                  "model",
                  "session_id",
                  "last_seq",
                  "tool_receipt_ids"
                ],
                "properties": {
                  "provider": {
                    "const": "agnes-ai"
                  },
                  "model": {
                    "type": "string"
                  },
                  "session_id": {
                    "type": "string"
                  },
                  "last_seq": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "tool_receipt_ids": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                },
                "additionalProperties": false
              }
            },
            "additionalProperties": false
          }
        }
      },
      "DocumentSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "source_id",
          "name",
          "media_type",
          "byte_size",
          "content_hash",
          "extraction_status",
          "pages"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "name": {
            "type": [
              "string",
              "null"
            ]
          },
          "media_type": {
            "enum": [
              "application/pdf",
              "text/plain"
            ]
          },
          "byte_size": {
            "type": "integer",
            "minimum": 0
          },
          "content_hash": {
            "type": "string"
          },
          "extraction_status": {
            "const": "extracted"
          },
          "pages": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "page",
                "start",
                "end"
              ],
              "properties": {
                "page": {
                  "type": "integer",
                  "minimum": 1
                },
                "start": {
                  "type": "integer",
                  "minimum": 0
                },
                "end": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          }
        }
      },
      "RunSummaryPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "runs",
          "next_cursor"
        ],
        "properties": {
          "runs": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/RunSummary"
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          }
        }
      },
      "DocumentSummaryPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "documents",
          "next_cursor"
        ],
        "properties": {
          "documents": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/DocumentSummary"
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          }
        }
      },
      "SessionState": {
        "type": "object",
        "required": [
          "user",
          "csrf_token",
          "profile_revision",
          "scope_epoch",
          "all_clear_epoch"
        ],
        "properties": {
          "user": {
            "anyOf": [
              {
                "type": "object",
                "required": [
                  "id",
                  "username"
                ],
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "username": {
                    "type": "string"
                  }
                },
                "additionalProperties": false
              },
              {
                "type": "null"
              }
            ]
          },
          "csrf_token": {
            "type": [
              "string",
              "null"
            ]
          },
          "profile_revision": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1
          },
          "scope_epoch": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1
          },
          "all_clear_epoch": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          }
        },
        "additionalProperties": false
      }
    },
    "parameters": {
      "HealthThreadEpoch": {
        "name": "X-HealthThread-Epoch",
        "in": "header",
        "required": true,
        "description": "Immutable operation-ticket scope_epoch from login/me. Positive safe integer. Missing/invalid428; stale uncommitted mutation409. Same-key committed receipt lookup precedes epoch comparison; never an owner identity.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        }
      }
    },
    "headers": {
      "HealthThreadEpoch": {
        "description": "Fresh authenticated scope_epoch after this successful response. Do not upgrade an existing pending operation ticket.",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      },
      "HealthThreadAllClearEpoch": {
        "description": "Fresh durable all_clear_epoch; increments only on new all-data erase, including empty scope.",
        "schema": {
          "type": "integer",
          "minimum": 0
        }
      }
    }
  }
}
