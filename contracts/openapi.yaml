    "/api/runs/{id}/reanalyse": {
      "post": {
        "summary": "Expire a needs_review proposal and atomically create a new run from saved sources using the current profile revision; never confirm stale facts",
        "operationId": "post_runs_id_reanalyse",
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
