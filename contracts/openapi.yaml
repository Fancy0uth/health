                    "time_course",
                    "self_rating",
                    "impact_context",
                    "associated",
                    "measurements",
                    "background_care",
                    "evidence_status"
                  ],
                  "description": "Eight concise independent syntheses; unknown=null means unrecorded, never normal/absent. Preserve temporal range of denials, self-rating attribution, measurement units/original dates, document judgment attribution, and planned versus reported executed treatment. Do not copy the full history into each dimension."
                },
