{
  "openapi": "3.1.0",
  "info": {
    "title": "HealthThread authenticated domain API",
    "version": "1.0.0",
    "description": "Typed schemas describe actual authenticated HTTP projections and stored export forms. Extractive field validity still requires server checks and explicit user review; schema validity is not clinical correctness."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "session": []
    }
  ],
  "paths": {
    "/api/auth/login": {
      "post": {
        "summary": "Explicitly provisioned local demo account login",
        "operationId": "post_auth_login",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionState"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Domain error; no sensitive internals",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [],
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true,
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                },
                "required": [
                  "username",
                  "password"
                ]
              }
            }
          }
        }
      }
    },
    "/api/auth/register": {
      "post": {
        "summary": "Create a local account and authenticate without granting health analysis consent",
        "description": "Same-origin only. Shares the per-address login rate limit. Username is trimmed and case-sensitive; an existing or configured model-owner username cannot be overwritten or claimed. A lost response may mean creation succeeded: log in with the same credentials to recover. Credentials are never journaled by the shared client.",
        "operationId": "post_auth_register",
        "security": [],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "description": "Must match this server origin.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "username",
                  "password"
                ],
                "properties": {
                  "username": {
                    "type": "string",
                    "minLength": 3,
                    "pattern": "^\\s*[A-Za-z0-9_.-]{3,32}\\s*$",
                    "description": "After trimming outer whitespace, the account name must be 3–32 ASCII letters, numbers, dots, underscores or hyphens; case-sensitive."
                  },
                  "password": {
                    "type": "string",
                    "minLength": 10,
                    "maxLength": 128,
                    "pattern": "\\S",
                    "description": "Whitespace-only passwords are rejected; accepted passwords are hashed using a unique salt and scrypt."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Independent account created with analysis consent disabled; authenticated session cookie issued",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionState"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              },
              "Set-Cookie": {
                "description": "ht_session; HttpOnly; SameSite=Strict; Secure when served over HTTPS",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Invalid username/password bounds or unknown request fields",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "ACCOUNT_EXISTS: log in or choose a different username",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Registration JSON exceeds 4096 bytes",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Shared authentication rate limit exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Domain error; no sensitive internals",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
