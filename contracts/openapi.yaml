                  "enum": [
                    "active",
                    "improving",
                    "resolved",
                    "uncertain"
                  ],
                  "description": "Follow-up state, never severity or evidence type. Use evidence_status dimension for source attribution."
                },
                "assessment": {
                  "type": "string",
