    "/api/auth/login": {
      "post": {
        "summary": "Explicitly provisioned local demo account login",
        "operationId": "post_auth_login",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionState"
                }
              }
            },
            "headers": {
              "X-HealthThread-Epoch": {
                "$ref": "#/components/headers/HealthThreadEpoch"
              },
              "X-HealthThread-All-Clear-Epoch": {
                "$ref": "#/components/headers/HealthThreadAllClearEpoch"
              }
            }
          },
          "default": {
            "description": "Domain error; no sensitive internals",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [],
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true,
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                },
                "required": [
                  "username",
                  "password"
                ]
              }
            }
          }
        }
      }
    },
